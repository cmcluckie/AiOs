[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The runtime: the loop, the prompts, folding, the model clients and the ledger,
# ported from CivicCanada's agent (C#) as logic, not code (agent/origin.toml).  It
# knows nothing of AiOs: no part plans, no jig, no pool.

[features]
# a transport that hands back saved replies and keeps what was sent, for the tests;
# never in a build that talks to a model
fake = []

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
