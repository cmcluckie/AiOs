# What only a human decides (CLAUDE.md, "Decision ledger").  A change to any path
# below is refused by the referee (`jig/ledger`) unless a decision in decisions/, in the
# same change, names the path in its touches and is decided by a key in
# constitution/keys/.  An agent may draft that decision; only a human's key makes
# it one.  Globs are the shell's.  This file is on its own list.
[human-only]
tests        = ["tests/*.toml", "tests/expected/*", "tests/fixtures/*", "tests/programs/*", "tests/mutations.txt"]
specs        = ["specs/*"]
purposes     = ["constitution/purposes/*"]
capabilities = ["index/cap/*"]
dependencies = ["index/tool/*"]
licence      = ["LICENSE"]
rules and words = ["CLAUDE.md", "constitution/*", "schema/*", "posts/voice.md", "pool/AGT.referee@1/*", "jig/aios", "jig/ledger", "jig/test", "jig/mutate", "jig/postcheck", "jig/donecheck", "jig/reader", "jig/linux.pin", "jig/runs", "jig/scorecard", "jig/judge", "jig/model", "jig/sit", "jig/prices.toml", "jig/budget.toml", "exam/*", ".githooks/*"]
