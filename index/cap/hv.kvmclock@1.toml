code       = "CAP.hv.kvmclock@1"
status     = "draft"
admitted   = ""
retired_by = ""
touches    = "KVM's paravirtual clock: the processor counter's rate as KVM states it"
mechanism  = "CPUID leaves 1, 0x40000000 to 0x4000ff00 and 0x40000001 to find KVM and its CLOCKSOURCE2 feature; MSR 0x4b564d01 written once with the address of 32 bytes to lend, once with 0 to take them back; only CMP.timer.kvmclock may, and only during the loader's boot"
scope      = "none"
scope_rule = "^$"
