asked   = "Part 20, pieces (e) to (g) of findings 0023: the kernel runs a normal Linux program file, and Berkeley's cat runs on it (findings 0023 items 11 and 12, decision 0046).  New versions on top of the old: PART.loader@10 (a static 32-bit ELF loaded where it says, the stack Linux lays out, arguments from the kernel command line, TECH-DEBT 4 for AT_RANDOM), PART.gate@2 (the Linux calls cat makes, each refusing the rest with Linux's error number; Ctrl+D ends typed input; a Linux program's exit status said on the console), MACHINE.serial-disk@2 (a kernel command line).  The builder builds musl from lifted/ and links a program that depends on it as a static ELF.  musl's three start files and crt_arch.h are added to the lift, which missed them, and jig/libc pieces lists start files by name.  Petition 0014, Chris's, supersedes the model's 0013 with six changes (findings 0023 item 12) and passes every rule; the cat flavor moves to it.  Specs SPEC.cat.1 to 5 for the numbers the model's petition named, and SPEC.gate.8, SPEC.gate.9, SPEC.loader.14, SPEC.machine.6; nine tests, twenty-two mutations, each run in Claude's workspace under software emulation: every test green there but TST.cat.missing-file@1, which is red on Berkeley's 1995 bug and stays red in this change; every mutation killed there, after three were rewritten because they broke the build instead of the code and one was replaced because musl does not notice it (findings 0023 item 12 c).  TST.cat.missing-file@1's two mutations come with the fix.  Nothing here has run on the jig yet."
options = ["as written", "fix Berkeley's bug in this change"]
default = "as written"
chose   = "as written"
why     = "Decision 0038: the missing-file test goes red on Berkeley's code as lifted, untouched, and the fix is its own change, so the red is on the record before it is fixed."
