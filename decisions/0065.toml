asked   = "Try 5 (findings 0024 item 18) turned five cat tests red: the cat tests' helper, tests/programs/catfiles.c, saved its files on cat's own kernel, which could write because PART.fs.minix@2 brought writing in whole though petition 0014 asks only to read.  Rule 11 (schema/petition.md) already said a built image exposes no capability not granted, checked against the artifact; nothing checked it.  Three pieces.  One: the builder sets GRANT_ for every capability a flavor asks for, PART.fs.minix@2 compiles its writing in only under GRANT_FS_WRITE (Linux's #ifdef CONFIG_, the petition as the configuration), loader@10's save answers -1 without it, and a kernel that cannot honour the switch is refused by name.  Two: the referee holds every linked kernel to rule 11 (referee artifact), using nm on the image; what eight older flavors' kernels expose unasked today is listed in constitution/extras.toml, which only shrinks.  Three: rule 22, a test program boots only where every call it makes is asked for, listed or expected refused (referee probes); catfiles.c now writes the disk on the editor's kernel, which asks to write.  The mechanic's prompt states rule 11 and the judge rule as it is since decision 0060.  Three red tests, all red before and green after (TST.fs.no-write, TST.referee.artifact, TST.referee.probes-granted), eight mutations killed; three older mutations rewritten because the referee now refuses their broken copies first.  Every other flavor's kernel is byte for byte what it was; cat's is 4,196 bytes smaller."
options = ["as written", "fix the eight older kernels now as well", "hold only new kernels to rule 11", "every probe through the referee, hostile ones too"]
default = "as written"
chose   = "as written"
why     = "Chris, 2026-10-23: go; baseline the older ones; helpers via grants, and probes that expect a refusal stay as they are.  The petition is the authority, and a rule the referee never sees is a note, not a rule."
