asked   = "The layered agent in Rust (findings 0027, decision 0094), each piece with a test that was red without it.  The runtime, which knows nothing of AiOs (SPEC.agent.7): CivicCanada's ReAct loop, the system and user prompt split, room and folding, ported as logic and credited in agent/origin.toml; the two gears' model clients, with Bedrock signed by hand and checked against AWS's published examples; the prompt library's fingerprints; the prices.  The program on top: the result note (SPEC.agent.1), the part plan (SPEC.agent.2), one call (SPEC.agent.3), a builder judged on the jig by one ssh command with nothing installed there (SPEC.agent.4), a director with the stuck rule, the caps, the question note and the fold (SPEC.agent.5), and gear 2 with the part's share and the month's cap asked before every paid call (SPEC.agent.6).  43 mutations, all killed.  The run record and the scorecard carry the bench, peak context and how a run ended (SPEC.exam.10, three mutations).  The month's cap goes from $20 to $40, the one value both benches are counted against.  The prompt library, prompts/, its first two versions, their own and not the mechanic's.  agent/plans/waits.toml, a first part plan.  The holes a cold review of the C version found are closed and tested here: a path the model chose could write outside the builder's folder, a fix could pass by stopping a green test or printing its own PASS, a jig gone mid-run was taken for a failed fix, and jobs on different tests failing the same way were called stuck.  The agent's tests need cargo, so on the jig they skip and say why.  Not built: the prompt trial, the mentor, the shift log and the track-record check."
options = ["take it", "take it without the cap change", "do not take it"]
default = "take it"
chose   = "take it"
why     = "Chris, 2026-10-28: \"Build the three-layer design from the spec now, in this part ... One module per piece.  Tests for the agent itself, written to fail.  The budget cap is one config value Chris sets.  Start it at $40.\"  Chris, 2026-10-29: \"The agent is Rust, not C ... Same shape as before: a runtime with no AiOs knowledge ... with its own red tests, and the director/builder program on top.\"  The cap already lives in one place every run is counted against, jig/budget.toml, so the agent's runs go through jig/runs and that is the one value."
