asked   = "Findings 0023 item 10: four choices before the kernel learns to run a normal Linux program file.  (1) Where cat runs: Linux's own address, 0x08048000, unchanged, or relinked into AiOs's window at 4 MiB.  (2) Where its arguments come from: the kernel command line, or fixed in the flavor.  (3) What musl's 16 AT_RANDOM bytes are, since AiOs has no random source: the cycle counter, labelled as not random, or zeros, labelled.  (4) Which files cat can open: read-only from the Minix disk, or files packed into the image."
options = ["Linux's address; the kernel command line; the cycle counter, labelled; read-only from the disk", "AiOs's window; fixed in the flavor; zeros, labelled; packed into the image"]
