clause     = "A model sits an exam item by being shown the question and the part's header, looking at Linux only through the reader, and writing the file the item asks for; the lift is judged by the judge, a failed try is shown its failing test and its own file before the next, every try is recorded with its tokens and cost whether it passed, failed or wrote nothing, and nothing is called when the judge cannot pass the hand lift; each request marks the prompt, the tools and the latest message to be cached, so that what has already been sent is charged at the cached rate."
