clause     = "A Linux program sees Linux's table alone: every system call the gate answers it is at Linux's 32-bit x86 number for that call, and at a number Linux has no call for, 1000 to 1003 among them, it answers what Linux does, -38 (ENOSYS).  Programs written for the old table keep its own numbers, 1000 to 1003, as a second table, the way Linux keeps one table for each kind of program, and keep working through it; no old call is answered at a Linux number (TECH-DEBT 1, findings 0021 item 5, as decision 0074 reads it)."
author     = "KEY.chris"
