clause     = "A builder is one fresh session on one job: a red test, the commit to start from and the library's builder prompt.  It looks at its own copy of the repo at that commit, never the repo itself and never runs/, through the look tool jig/fix gives the mechanic: every look says why or is refused, nothing outside the copy, each answer cut at 8000 characters with a marker that says how much more there was.  Its fix is the files of one part under pool/, judged by the suite on the jig over ssh at the same commit, with nothing new installed there: a pass if the red test turns green and nothing green turns red.  A call it cannot read is answered with what was wrong; it is told its calls left after each; when the conversation passes its share of the context, the oldest answers are dropped, the last four kept, and it is told.  The run ends in a pass, or in a fail with an honest reason: out of calls, out of room, out of time, stopped, or the model gone (SPEC.agent.8 for what happens to its work then); and the run records the bench, its peak context, its tokens, the change and the result note (findings 0027)."
