clause     = "The system call table a program is handed keeps its seven entries at their offsets, so every earlier program runs unchanged, and each entry that has no Linux number yet (alloc, ms, load, save) uses an AiOs-only number of 1000 or more, marked in the source as tech debt and listed in findings 0021."
