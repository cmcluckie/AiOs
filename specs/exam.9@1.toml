clause     = "A model named ollama:NAME is called on a local Ollama (OLLAMA_URL, default http://localhost:11434) by the same rules as any other: it needs a price, and the cap is asked first.  The request the exam builds is handed to Ollama as one whole chat (the system prompt first, earlier tool calls and their answers handed back as such, the tools offered), with the context size (MODEL_NUM_CTX, default 32768) and the reply's limit set on the request, never in Ollama's own settings; the reply comes back in the shape the exam already reads, with Ollama's own token counts, and a reply Ollama cut off at its limit as max_tokens (decision 0086), or, stopped short of it by a full context, as model_context_window_exceeded (decision 0090).  An Ollama that cannot be reached means this host cannot run it."
author     = "KEY.chris"
