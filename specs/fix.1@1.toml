clause     = "jig/fix hands one red test to one model: the test, its spec clause and what it printed.  The model may look at the repo through a tool that answers only from a copy of it and refuses any path outside it, and hands in its fix through another, as one or more whole files of one part under pool/.  The suite runs once on the repo as it is and once with the fix in its own copy: the fix is a pass only if the red test turns green and no test that was green turns red; tests already red before are other jobs and do not count against it.  Every call is written into the run record with its tokens, and the run with its result and the code lines the fix changed.  A test that is already green is refused before any call; a fix outside pool/, or across more than one part, is refused unjudged; nothing the model does changes the repo.  A reply cut off at the token limit is said to be, to the person watching and to the model; a conversation that outgrew the model's context ends the run, said as that (decision 0090).  Every look says why, what it expects to learn, or is refused and not run, and the why is said as it goes; a look's answer is cut at FIX_LOOK_CHARS (8000), with a marker that says so (decision 0092).  Given a commit (FIX_AT), the model looks at, and the judge runs, the repo as it was at that commit, with no run records, and the run records the commit (decision 0086)."
author     = "KEY.chris"
