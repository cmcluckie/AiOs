clause     = "jig/fix hands one red test to one model: the test, its spec clause and what it printed.  The model may look at the repo through a tool that answers only from a copy of it and refuses any path outside it, and hands in its fix through another, as one whole file under pool/.  The suite runs once on the repo as it is and once with the fix in its own copy: the fix is a pass only if the red test turns green and no test that was green turns red; tests already red before are other jobs and do not count against it.  Every call is written into the run record with its tokens, and the run with its result and the code lines the fix changed.  A test that is already green is refused before any call; a fix outside pool/ is refused unjudged; nothing the model does changes the repo."
author     = "KEY.chris"
