clause     = "The machine presents the guest one 16550 serial port and one ISA VGA card in 80 by 25 colour text mode, and no network, storage, timer, interrupt controller or input device; whatever else the hypervisor forces present is named in the as-built spec and touched by no component; a reset request ends the machine."
