clause     = "The race's columns exist before the race: every builder's result note says its calls to the model, the most context one of them held, and its wall minutes; a director adds to each note it is shown its own peak context as of that job; every run in runs/ keeps its calls and wall seconds; and the scorecard's line for a part shows its builders, their calls, the biggest peak among them, the director's peak and the part's wall minutes, with a dash where a run was recorded before these columns (findings 0029)."
