clause     = "A builder out of its depth calls a friend, Claude on Bedrock: at the plan's call with nothing handed in, after its count of hand-ins that did not build, or at its latest call, whichever comes first, and once more if a hand-in after the briefing is still not a pass; a stuck director calls once before it stops.  The friend is shown why it was called, the job, what the test prints now, what the card did and the files it changed, whole; it may look at the card's copy of the repo for itself, ten looks at most; and it sends back a briefing, never a fix, in which every place it points at is lines quoted from the file, refused if the file does not hold them.  Only the briefing reaches the card.  Each turn is asked of the friend's share of the plan and of the month's cap before it is sent; the call is recorded in runs/, and the run keeps its cost, its calls and how it went: pass, moved, same or worse.  A plan with no friend never calls one (findings 0052, 0053, 0055)."
author     = "KEY.chris"
