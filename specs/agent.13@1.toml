clause     = "A builder out of its depth calls a friend, Claude on Bedrock, once: at the plan's call with nothing handed in, after its count of hand-ins that did not build, or at its latest call, whichever comes first; a stuck director calls once before it stops.  The friend is shown why it was called, what the card was given, what it did and what the tests said, and sends back a briefing, never a fix, which reaches the card; the call is asked of the friend's share of the plan and of the month's cap before it is sent, and is recorded in runs/ as a briefing.  A plan with no friend never calls one (findings 0052)."
author     = "KEY.chris"
