clause     = "The model hands in its petition with a tool, submit_petition, whose one field is the petition: when it uses it, what is in that field, exactly as written, is the draft given to the referee and nothing it wrote outside the field is, and everything it wrote, inside the field and out, is kept in the run record; prose inside the field is refused like prose anywhere else."
