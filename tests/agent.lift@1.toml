code       = "TST.agent.lift@1"
status     = "draft"
admitted   = ""
retired_by = ""
binds      = "SPEC.agent.12@1"
red_when   = "a lifter is offered more than read_linux, write_file and submit_lift; is not shown the question, the file to write and the header, or is shown the hand lift; a read with no why, a command the reader has not or an argument with a ; or a space reaches the jig; a file the part does not ask for is written; a wrong lift is not shown what failed, or one that does not build what the compiler said, or a right one is not a pass recorded under the item's name; a lifter is not shown the item's tests, their checks and the programs they run; a lifter after the first does not start from the last lifter's file, shown with what the tests said of it; a lift never handed in is not handed in by the program; a hand lift that fails does not stop it first; or an exam plan takes tests too or its jobs do not carry the item"
timeout_ms = 120000
isolates   = "TOOL.agent@1"
runner     = "jig/test cmd sh tests/programs/agent.sh lift"
mutations  = 10
